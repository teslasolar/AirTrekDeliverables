<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirTrek — Empathy Through Cultural Exploration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body>
  <!-- Loading indicator shown until templates are injected -->
  <div class="template-loading">
    <div class="spinner"></div>
    Loading AirTrek...
  </div>

  <!-- Each section loads from its own template file -->
  <div data-template="templates/header.html"></div>
  <div data-template="templates/hero.html"></div>
  <div data-template="templates/stats.html"></div>
  <div data-template="templates/quick-access.html"></div>
  <div data-template="templates/architecture.html"></div>
  <div data-template="templates/categories.html"></div>
  <div data-template="templates/status.html"></div>
  <div data-template="templates/footer.html"></div>

  <script src="js/loader.js"></script>
  <script src="js/status.js"></script>
</body>
</html>
