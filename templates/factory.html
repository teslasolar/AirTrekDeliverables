<div class="section factory-section">
  <div class="factory-header-row">
    <div>
      <h2 class="section-title">Factory Floor</h2>
      <p class="section-desc">
        ISA-88 batch production view — deliverables flow through procedures (phases),
        unit procedures (categories), and operations (individual items) with tracked state transitions.
      </p>
    </div>
    <div class="factory-legend">
      <span class="legend-item"><span class="legend-dot" style="background:#6b7084"></span>Idle</span>
      <span class="legend-item"><span class="legend-dot" style="background:#F59E0B"></span>Held</span>
      <span class="legend-item"><span class="legend-dot" style="background:#4F7BF7"></span>Running</span>
      <span class="legend-item"><span class="legend-dot" style="background:#7C5CFC"></span>Completing</span>
      <span class="legend-item"><span class="legend-dot" style="background:#34D399"></span>Complete</span>
    </div>
  </div>

  <!-- Rendered by js/factory.js -->
  <div id="factoryDashboard" class="factory-dashboard">
    <div class="factory-loading">
      <div class="spinner"></div>
      Loading production data...
    </div>
  </div>
</div>
